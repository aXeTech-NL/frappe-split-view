name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_version.py --tag "$RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tags must be annotated Git tags: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION_WITHOUT_BUILD="${RELEASE_TAG%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Required CI suite
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: [validate-tag, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          ## Highlights
          See CHANGELOG.md for the release summary.

          ## Added
          See CHANGELOG.md.

          ## Changed
          See CHANGELOG.md.

          ## Fixed
          See CHANGELOG.md.

          ## Compatibility
          Declared compatibility: Frappe >=16.0.0,<17.0.0.
          Consult the release changelog and CI result for tested status; declaration alone is not runtime proof.

          ## Upgrade notes
          Install or update from the immutable ${TAG} repository tag using Bench, then migrate and build.
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Frappe Split View $TAG" \
              --notes-file release-notes.md \
              --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "Frappe Split View $TAG" \
              --notes-file release-notes.md \
              --prerelease="$PRERELEASE" \
              --latest=false
          fi
